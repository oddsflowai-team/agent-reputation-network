- name: Debug HF token length
  env:
    HF_TOKEN: ${{ secrets.HF_TOKEN_ODDSFLOWAI }}
  run: |
    python - <<'PY'
    import os
    t=os.environ.get("HF_TOKEN","")
    print("HF_TOKEN length:", len(t))
    PY

- name: HF whoami
  env:
    HF_TOKEN: ${{ secrets.HF_TOKEN_ODDSFLOWAI }}
  run: |
    curl -s -H "Authorization: Bearer $HF_TOKEN" https://huggingface.co/api/whoami-v2



name: Sync to Hugging Face Hub

on:
  push:
    branches: ["main"]
    paths:
      - "README.md"
      - "docs/**"
      - "schemas/**"
      - "LICENSE"
      - "CITATION.cff"
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync to Hugging Face
        uses: huggingface/hub-sync@v0.1.0
        with:
          github_repo_id: ${{ github.repository }}
          huggingface_repo_id: oddsflowai-team/agent-reputation-network
          hf_token: ${{ secrets.HF_TOKEN_ODDSFLOWAI }}
          repo_type: model
          private: false
          subdirectory: ""
