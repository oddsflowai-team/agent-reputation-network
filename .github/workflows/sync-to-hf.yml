name: Sync to Hugging Face (upload only)

on:
  push:
    branches: ["main"]
    paths:
      - "README.md"
      - "docs/**"
      - "schemas/**"
      - "LICENSE"
  workflow_dispatch:

jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install huggingface_hub
        run: pip install --upgrade huggingface_hub

      - name: Upload to Hugging Face (repo already exists)
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN_ODDSFLOWAI }}
          HF_REPO_ID: Oddsflowai-team/agent-reputation-network
          HF_REPO_TYPE: model
        run: python .github/scripts/push_to_hf.py
